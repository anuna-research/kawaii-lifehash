<template id="audio-template"><div class="voice-controls"><label class="speech-field" for="audio-file">Play your own audio</label><input id="audio-file" type="file" accept="audio/*"><label class="speech-field" for="audio-url">Or use an audio URL</label><input id="audio-url" type="url" placeholder="https://example.com/audio.mp3"><button id="play-audio-url" type="button">Play audio URL</button><label class="speech-field" for="speech-text">What should your companion say?</label><textarea id="speech-text" rows="2" maxlength="1000">Hello! I found something interesting. Shall we take a closer look?</textarea><div class="speech-actions"><button id="speak-text" type="button">Speak text</button><button id="plain-speech" type="button">Hear plain voice</button></div><label class="speech-field" for="voice-engine">Chatter style</label><select id="voice-engine"><option value="procedural">Procedural chatter</option><option value="speech">Character speech</option></select><label class="speech-field" for="phrase-length">Chatter length · <output id="phrase-length-value" for="phrase-length">4 syllables</output></label><input id="phrase-length" type="range" min="1" max="8" value="4" step="1"><p id="voice-character" class="voice-character"></p><button id="hear-voice" type="button">Hear this companion ♪</button><button id="stop-voice" type="button" disabled>Stop</button><label class="voice-toggle"><input id="voice-enabled" type="checkbox"> Voice with expressions</label><p id="voice-phrase" role="status" aria-live="polite">A little creature chatter, in your companion’s own voice.</p><div id="voice-examples" class="voice-examples" aria-label="Compare character voices"></div></div></template>
